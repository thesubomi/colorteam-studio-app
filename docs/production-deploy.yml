# Workflow for thesubomi/colorteam-studio-app-production (copy to .github/workflows/deploy.yml there).
# Builds the `production` branch of thesubomi/colorteam-studio-app and serves it at app.colorteam.io.
# Custom domain and HTTPS are set in that repo's Settings > Pages.
name: Deploy app.colorteam.io
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: thesubomi/colorteam-studio-app
          ref: production
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html && rm -f dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
